<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Weather Management System</h1>

        <p>CSCE 548 - Building Secure Software</p>

        <div class="top-buttons">

            <button onclick="loadWeatherUI()">Load Weather UI</button>

            <button onclick="loadWeatherJSON()">Load Weather JSON</button>

            <button onclick="loadAlerts()">Load Weather Alerts</button>

        </div>

    </header>

    <div id="statusMessage" class="status-message"></div>

    <section>

        <h2>Weather Dashboard</h2>

        <div id="weatherCards" class="weather-cards"></div>

    </section>

    <section>

        <h2>Weather Alerts</h2>

        <div id="alertCards" class="weather-cards"></div>

    </section>


    <section class="admin-panel">

        <h2>Manage Weather Records</h2>

        <div class="form-grid">

            <input id="recordId" placeholder="Record ID" readonly>

            <input id="city" placeholder="City">

            <input id="state" placeholder="State">

            <input id="condition" placeholder="Condition">

            <input id="temperature" type="number" placeholder="Temperature">

            <input id="humidity" type="number" placeholder="Humidity">

            <input id="date" type="date">

        </div>

        <div class="buttons">

            <button onclick="addRecord()">Add</button>

            <button onclick="updateRecord()">Update</button>

            <button onclick="deleteRecord()">Delete</button>

            <button onclick="clearWeatherForm()">Clear</button>

        </div>

    </section>

    <div class="controls">

        <h2>Administrative Panel</h2>

        <label>

            Choose Table

        </label>

        <select id="adminType" onchange="changeAdminSection()">
            
            <option value="station">
                Weather Station
            </option>

            <option value="location">
                Weather Location
            </option>

            <option value="condition">
                Weather Condition
            </option>

            <option value="alert">
                Weather Alert
            </option>

        </select>

        <div id="stationSection" class="admin-section">

            <h3>Weather Station</h3>

            <input id="adminCity" placeholder="City">

            <input id="adminState" placeholder="State">

            <input id="adminStationName" placeholder="Station Name">

            <button onclick="handleAdminAction()">
                Add Station
            </button>

        </div>

        <div id="locationSection" class="admin-section" style="display:none;">

            <h3>Weather Location</h3>

            <input id="locationInput" placeholder="Location Name">

            <input id="locationCity" placeholder="City">

            <input id="locationState" placeholder="State">

            <button onclick="addLocation()">
                Add Location
            </button>

        </div>

        <div id="conditionSection" class="admin-section" style="display:none;">

            <h3>Weather Condition</h3>

            <input id="adminCondition" placeholder="Condition">

            <input id="adminHumidity" type="number" placeholder="Humidity">

            <input id="adminTemp" type="number" placeholder="Temperature">

            <button onclick="addCondition()">Add Condition</button>

        </div>

            <div id="alertSection" class="admin-section" style="display:none;">

                <h3>Weather Alert</h3>

                <select id="locationDropdown">

                    <option value="">
                        Select Location
                    </option>

                </select>

                <select id="conditionDropdown">

                    <option value="">
                        Select Condition
                    </option>

                </select>

                <input id="adminSeverity" placeholder="Severity">

                <input id="adminDescription" placeholder="Description">

                <input id="alertDate" type="date">

                <button onclick="addAlert()">
                    Create Alert
                </button>

            </div>

        </div>

    </section>

    <footer>
        &copy; 2026 Hardik Marlapudi. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
